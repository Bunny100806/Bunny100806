<text x="65" y="63" font-family="sans-serif" font-size="14" font-weight="700" fill="#E5B5C7" letter-spacing="3" >02  /  RECOGNITION   •   HACKYEAH 2026</text><text x="65" y="161" font-family="Georgia,serif" font-size="103" font-weight="400" fill="#F8F0F3" >Top 3.</text><text x="65" y="220" font-family="sans-serif" font-size="25" font-weight="400" fill="#E5B5C7" >Goldman Sachs — AI Control Layer challenge</text><text x="65" y="259" font-family="monospace" font-size="14" font-weight="600" fill="#AE8E9C" letter-spacing="2" >TEAM SEVA   /   AEGISTWIN   /   KRAKÓW, POLAND</text><g><circle cx="1024" cy="151" r="97" fill="none" stroke="#B66487" stroke-opacity=".45" stroke-width="2"/><circle cx="1024" cy="151" r="76" fill="none" stroke="#D494AC" stroke-opacity=".28" stroke-dasharray="4 8"/><text x="1024" y="172" font-family="Georgia,serif" font-size="73" font-weight="400" fill="#F8F0F3" letter-spacing="0" text-anchor="middle">03</text><path d="M 1024 54 A 97 97 0 0 1 1119 169" stroke="#F2BDD2" stroke-width="4" fill="none" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 1024 151" to="360 1024 151" dur="18s" repeatCount="indefinite"/></path></g></g></svg>