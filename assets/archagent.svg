<text x="63" y="66" font-family="sans-serif" font-size="14" font-weight="700" fill="#E5B5C7" letter-spacing="2.7" >05  /  SELECTED WORK  —  INDEPENDENT PROJECT</text><text x="63" y="167" font-family="Georgia,serif" font-size="91" font-weight="400" fill="#F8F0F3" >ArchAgent-R.</text><text x="63" y="221" font-family="Georgia,serif" font-size="24" font-weight="400" fill="#E5B5C7" >From natural language to architecture.</text><text x="65" y="271" font-family="monospace" font-size="13" font-weight="600" fill="#AE8E9C" letter-spacing="1.4" >REACT  /  FASTAPI  /  OLLAMA  /  SOFTWARE DESIGN</text><text x="65" y="334" font-family="sans-serif" font-size="17" font-weight="400" fill="#E5B5C7" >Structured diagrams and architecture reasoning</text><rect x="830" y="120" width="121" height="53" rx="11" fill="#4C1B34" stroke="#D39AB4" stroke-opacity=".65"/><text x="890" y="152" font-family="monospace" font-size="14" font-weight="700" fill="#F8F0F3" letter-spacing="1" text-anchor="middle">INPUT</text><rect x="1010" y="102" width="121" height="53" rx="11" fill="#4C1B34" stroke="#D39AB4" stroke-opacity=".65"/><text x="1070" y="134" font-family="monospace" font-size="14" font-weight="700" fill="#F8F0F3" letter-spacing="1" text-anchor="middle">MODEL</text><rect x="1000" y="250" width="121" height="53" rx="11" fill="#4C1B34" stroke="#D39AB4" stroke-opacity=".65"/><text x="1060" y="282" font-family="monospace" font-size="14" font-weight="700" fill="#F8F0F3" letter-spacing="1" text-anchor="middle">DESIGN</text><path d="M951 146 H 1010" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-dasharray="35 70" opacity=".64"><animate attributeName="stroke-dashoffset" from="900" to="-900" dur="3s" repeatCount="indefinite"/></path><path d="M1070 155 V 250" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-dasharray="35 70" opacity=".64"><animate attributeName="stroke-dashoffset" from="900" to="-900" dur="3.8s" repeatCount="indefinite"/></path><path d="M1000 278 H 928 Q 893 278 893 240 V 173" fill="none" stroke="#E5B5C7" stroke-width="2" stroke-dasharray="45 170" opacity=".64"><animate attributeName="stroke-dashoffset" from="900" to="-900" dur="5.2s" repeatCount="indefinite"/></path></g></svg>