<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Kaggle Learn Python course certificate showcase for Sai Charitharth Nadigoti">
 <defs>
  <linearGradient id="cert-bg" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#10070C"/><stop offset="0.54" stop-color="#1E0B15"/><stop offset="1" stop-color="#3E102B"/>
  </linearGradient>
  <radialGradient id="cert-aura" cx="50%" cy="50%" r="60%"><stop stop-color="#B95D8B" stop-opacity="0.52"/><stop offset="1" stop-color="#B95D8B" stop-opacity="0"/></radialGradient>
  <linearGradient id="cert-line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#E7B5C7" stop-opacity="0"/><stop offset=".5" stop-color="#F8DCE6" stop-opacity="1"/><stop offset="1" stop-color="#E7B5C7" stop-opacity="0"/></linearGradient>
  <linearGradient id="cert-gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9EDF2"/><stop offset=".55" stop-color="#E3B1C8"/><stop offset="1" stop-color="#AE678A"/></linearGradient>
  <pattern id="cert-grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M 38 0 L 0 0 0 38" fill="none" stroke="#CB8BA7" stroke-opacity=".065"/></pattern>
  <filter id="cert-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="cert-crop"><rect width="1200" height="280" rx="22"/></clipPath>
 </defs>
 <g clip-path="url(#cert-crop)">
  <rect width="1200" height="280" rx="22" fill="url(#cert-bg)"/>
  <rect width="1200" height="280" fill="url(#cert-grid)"/>
  <ellipse cx="1005" cy="138" rx="315" ry="220" fill="url(#cert-aura)"><animate attributeName="opacity" values=".55;1;.55" dur="7s" repeatCount="indefinite"/></ellipse>
  <rect x="18" y="18" width="1164" height="244" rx="14" fill="none" stroke="#E5B5C7" stroke-opacity=".28"/>
  <path d="M 52 18 H 240 M 960 262 H 1149" stroke="#E8C8D5" stroke-opacity=".42" fill="none"/>
  <text x="64" y="60" fill="#D9A6BC" font-family="Arial,sans-serif" font-size="14" letter-spacing="3.8" font-weight="700">CREDENTIAL  /  KAGGLE LEARN</text>
  <text x="62" y="146" fill="url(#cert-gold)" font-family="Georgia,serif" font-size="83">Python.</text>
  <text x="65" y="190" fill="#F8F0F3" font-family="Arial,sans-serif" font-size="21" letter-spacing=".4">Certificate of Completion</text>
  <text x="65" y="230" fill="#C59BB0" font-family="Arial,sans-serif" font-size="16" letter-spacing=".8">SAI CHARITHARTH NADIGOTI   /   KAGGLE</text>
  <g transform="translate(1028 139)">
   <circle r="92" fill="#431429" fill-opacity=".48" stroke="#E5B5C7" stroke-opacity=".26"/>
   <circle r="76" fill="none" stroke="#D997B5" stroke-opacity=".4" stroke-dasharray="2 9">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
   </circle>
   <circle r="58" fill="none" stroke="#F1C7D8" stroke-opacity=".6"/>
   <path d="M -22 -5 L -3 15 L 31 -25" fill="none" stroke="#F8ECF2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="75" stroke-dashoffset="75" filter="url(#cert-glow)">
    <animate attributeName="stroke-dashoffset" values="75;0;0" keyTimes="0;.55;1" dur="3s" repeatCount="indefinite"/>
   </path>
   <path d="M0 -92 A92 92 0 0 1 91 -10" fill="none" stroke="#E7A8C6" stroke-width="3" stroke-linecap="round" filter="url(#cert-glow)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
   </path>
  </g>
  <rect x="62" y="252" width="520" height="1.6" fill="url(#cert-line)" opacity=".75">
   <animate attributeName="width" values="120;520;520" keyTimes="0;.65;1" dur="5s" repeatCount="indefinite"/>
  </rect>
 </g>
</svg>
