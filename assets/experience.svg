<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Animated GitHub profile graphic">
<defs>
 <linearGradient id="bg-experience" x1="0%" y1="0%" x2="100%" y2="100%"><stop stop-color="#10070C"/><stop offset=".57" stop-color="#1D0A13"/><stop offset="1" stop-color="#330F21"/></linearGradient>
 <radialGradient id="halo-experience" cx="50%" cy="50%" r="55%"><stop stop-color="#AB3B6B" stop-opacity=".65"/><stop offset=".45" stop-color="#6D1D3D" stop-opacity=".26"/><stop offset="1" stop-color="#5C1835" stop-opacity="0"/></radialGradient>
 <linearGradient id="line-experience" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#71213D" stop-opacity="0"/><stop offset=".47" stop-color="#E5B5C7" stop-opacity=".78"/><stop offset="1" stop-color="#812448" stop-opacity="0"/></linearGradient>
 <linearGradient id="rose-experience" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F0F3"/><stop offset=".42" stop-color="#E5B5C7"/><stop offset="1" stop-color="#AB5479"/></linearGradient>
 <pattern id="grid-experience" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#B05E7B" stroke-opacity=".085" stroke-width="1"/></pattern>
 <filter id="glow-experience" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="clip-experience"><rect width="1200" height="360" rx="22"/></clipPath>
 </defs><g clip-path="url(#clip-experience)">
<rect width="1200" height="360" fill="url(#bg-experience)"/>
<rect width="1200" height="360" fill="url(#grid-experience)"/>
<ellipse cx="924" cy="172" rx="540" ry="342" fill="url(#halo-experience)" opacity=".72">
 <animate attributeName="opacity" values=".40;.82;.40" dur="11s" repeatCount="indefinite"/>
</ellipse>
<rect x="18" y="18" width="1164" height="324" rx="13" fill="none" stroke="#E0A8C0" stroke-opacity=".21" stroke-width="1"/>
<path d="M 48 18 H 218 M 990 342 H 1152" fill="none" stroke="#E5B5C7" stroke-opacity=".48" stroke-width="1.5"/>
<text x="58" y="65" font-family="sans-serif" font-size="14" font-weight="700" fill="#E5B5C7" letter-spacing="2.7" >03  /  EXPERIENCE   •   ENGINEERING IN PRACTICE</text><rect x="58" y="89" width="522" height="225" rx="12" fill="#2E1121" stroke="#C77B9B" stroke-opacity=".35"/><text x="81" y="130" font-family="monospace" font-size="13" font-weight="700" fill="#C77B9B" letter-spacing="1.5" >OCT 2025 — PRESENT</text><text x="81" y="195" font-family="Georgia,serif" font-size="44" font-weight="400" fill="#F8F0F3" >SG Analytics</text><text x="81" y="237" font-family="sans-serif" font-size="20" font-weight="400" fill="#E5B5C7" >Web Developer Intern</text><text x="81" y="283" font-family="sans-serif" font-size="15" font-weight="400" fill="#AE8E9C" >React / e-commerce UI &amp; landing pages</text><path d="M81 107 H142" stroke="#D996B4" stroke-width="2.5"><animate attributeName="stroke-opacity" values=".20;1;.20" dur="5s" repeatCount="indefinite"/></path><rect x="619" y="89" width="522" height="225" rx="12" fill="#2E1121" stroke="#C77B9B" stroke-opacity=".35"/><text x="642" y="130" font-family="monospace" font-size="13" font-weight="700" fill="#C77B9B" letter-spacing="1.5" >NOV 2024 — JAN 2025</text><text x="642" y="195" font-family="Georgia,serif" font-size="44" font-weight="400" fill="#F8F0F3" >RamanaSoft</text><text x="642" y="237" font-family="sans-serif" font-size="20" font-weight="400" fill="#E5B5C7" >C/C++ Developer Intern</text><text x="642" y="283" font-family="sans-serif" font-size="15" font-weight="400" fill="#AE8E9C" >C / C++ software development</text><path d="M642 107 H703" stroke="#D996B4" stroke-width="2.5"><animate attributeName="stroke-opacity" values=".20;1;.20" dur="5s" repeatCount="indefinite"/></path></g></svg>