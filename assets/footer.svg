 <radialGradient id="halo-footer" cx="50%" cy="50%" r="55%"><stop stop-color="#AB3B6B" stop-opacity=".65"/><stop offset=".45" stop-color="#6D1D3D" stop-opacity=".26"/><stop offset="1" stop-color="#5C1835" stop-opacity="0"/></radialGradient>
 <linearGradient id="line-footer" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#71213D" stop-opacity="0"/><stop offset=".47" stop-color="#E5B5C7" stop-opacity=".78"/><stop offset="1" stop-color="#812448" stop-opacity="0"/></linearGradient>
 <linearGradient id="rose-footer" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F0F3"/><stop offset=".42" stop-color="#E5B5C7"/><stop offset="1" stop-color="#AB5479"/></linearGradient>
