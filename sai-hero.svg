    <path d="M0 396L400 396M0 413H275M1040 0V492" stroke="#C77B9B" stroke-width="1" stroke-opacity=".10"/>
    <rect x="36" y="33" width="1208" height="426" rx="14" fill="none" stroke="#C77B9B" stroke-opacity=".27"/>
    <path d="M36 82H116M36 410H116M1164 82H1244M1164 410H1244" stroke="#E5B5C7" stroke-opacity=".55" stroke-width="2"/>
