<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="492" viewBox="0 0 1280 492" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Sai Charitharth Nadigoti — Full-Stack Developer and AI Security Builder</title>
  <desc id="heroDesc">Cinematic burgundy developer profile hero with glowing animated security-orbit illustration</desc>
  <defs>
    <linearGradient id="heroBg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#10070C"/><stop offset=".58" stop-color="#1B0B14"/><stop offset="1" stop-color="#270C1B"/></linearGradient>
    <radialGradient id="heroBloom" cx="70%" cy="48%" r="58%"><stop stop-color="#701A3D" stop-opacity=".53"/><stop offset=".54" stop-color="#451126" stop-opacity=".18"/><stop offset="1" stop-color="#10070C" stop-opacity="0"/></radialGradient>
    <linearGradient id="heroAccent" x1="0" x2="1"><stop stop-color="#C77B9B"/><stop offset=".5" stop-color="#F8F0F3"/><stop offset="1" stop-color="#A84871"/></linearGradient>
    <linearGradient id="heroScan" x1="0" x2="1"><stop stop-color="#701A3D" stop-opacity="0"/><stop offset=".5" stop-color="#E5B5C7" stop-opacity=".9"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></linearGradient>
    <pattern id="heroGrid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#C77B9B" stroke-opacity=".085" stroke-width="1"/></pattern>
    <pattern id="heroDots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#E5B5C7" opacity=".16"/></pattern>
    <filter id="heroGlow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="heroClip"><rect width="1280" height="492" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#heroClip)">
