      <path d="M90 114H167" stroke="#C77B9B" stroke-width="2"/>
      <text x="89" y="169" fill="#C77B9B" font-size="15" letter-spacing="3.6" font-weight="700">ENGINEER  ·  BUILDER  ·  EXPLORER</text>
