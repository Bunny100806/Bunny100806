        <path d="M-74 71A103 103 0 0 1 -5 -103" stroke="#B34872" stroke-width="4" stroke-linecap="round"/>
        <circle cx="-74" cy="71" r="5" fill="#F8F0F3"/>
      </g>
      <path d="M-32 -39L0 -57L32 -39V3Q28 33 0 49Q-28 33 -32 3Z" stroke="#E5B5C7" stroke-width="3" fill="#451126" fill-opacity=".9" filter="url(#heroGlow)"/>
      <path d="M-13 -1L-2 10L20 -15" stroke="#F8F0F3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#C77B9B"><circle cx="-205" cy="0" r="3"/><circle cx="205" cy="0" r="3"/><circle cx="0" cy="-205" r="3"/><circle cx="0" cy="205" r="3"/></g>
