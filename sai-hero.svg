      <path d="M90 352H567" stroke="url(#heroAccent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="130 350" filter="url(#heroGlow)">
        <animate attributeName="stroke-dashoffset" from="480" to="0" dur="6s" repeatCount="indefinite"/>
      </path>
      <text x="89" y="395" fill="#F8F0F3" font-size="18" letter-spacing="2.2">FULL-STACK DEVELOPMENT   /   AI SECURITY</text>
      <text x="90" y="432" fill="#C77B9B" font-size="13" letter-spacing="2.1">WARSAW, POLAND   ·   REACT + PYTHON + FASTAPI</text>
      <text x="1165" y="88" fill="#C77B9B" font-size="11" letter-spacing="2.2" text-anchor="end">SYSTEM / ONLINE</text>
      <text x="1165" y="425" fill="#E5B5C7" font-size="11" letter-spacing="2.2" text-anchor="end">EST. IN CURIOSITY</text>
