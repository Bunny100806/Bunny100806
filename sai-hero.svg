      <circle r="135" stroke="#E5B5C7" stroke-opacity=".24" stroke-dasharray="4 9"/>
      <circle r="103" stroke="#C77B9B" stroke-opacity=".60"/>
      <circle r="77" stroke="#C77B9B" stroke-opacity=".24"/>
      <g stroke="#E5B5C7" stroke-opacity=".18">
